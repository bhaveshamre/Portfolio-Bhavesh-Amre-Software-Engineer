<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accUR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glowUR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgUR)"/>
  
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Central Gateway Hub -->
  <g transform="translate(400, 240)">
    <!-- Connection Lines to 8 Microservices -->
    <g stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
      <line x1="0" y1="0" x2="-220" y2="-120"/>
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="220" y2="-120"/>
      <line x1="0" y1="0" x2="-250" y2="10"/>
      <line x1="0" y1="0" x2="250" y2="10"/>
      <line x1="0" y1="0" x2="-200" y2="140"/>
      <line x1="0" y1="0" x2="0" y2="160"/>
      <line x1="0" y1="0" x2="200" y2="140"/>
    </g>

    <!-- Gateway Center -->
    <circle r="46" fill="#1e293b" stroke="#f97316" stroke-width="3" filter="url(#glowUR)"/>
    <text text-anchor="middle" y="5" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#ffffff">API GATEWAY</text>

    <!-- Node 1: Auth Service -->
    <g transform="translate(-220, -120)">
      <rect x="-65" y="-22" width="130" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">Keycloak Auth</text>
    </g>
    <!-- Node 2: Discovery -->
    <g transform="translate(0, -150)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#a855f7">Discovery Service</text>
    </g>
    <!-- Node 3: Booking -->
    <g transform="translate(220, -120)">
      <rect x="-65" y="-22" width="130" height="44" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#22c55e">Booking Service</text>
    </g>
    <!-- Node 4: Escrow Payment -->
    <g transform="translate(-250, 10)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#f59e0b">Escrow Payment</text>
    </g>
    <!-- Node 5: Kafka Outbox -->
    <g transform="translate(250, 10)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#f97316">Kafka Outbox</text>
    </g>
    <!-- Node 6: Discovery Catalog -->
    <g transform="translate(-200, 140)">
      <rect x="-65" y="-22" width="130" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">Service Catalog</text>
    </g>
    <!-- Node 7: Notifications -->
    <g transform="translate(0, 160)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#ec4899">Notifications</text>
    </g>
    <!-- Node 8: Analytics -->
    <g transform="translate(200, 140)">
      <rect x="-65" y="-22" width="130" height="44" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#22c55e">Data Pipeline</text>
    </g>
  </g>

  <!-- Title Top -->
  <text x="40" y="50" font-family="'Syne', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="1">URBAN RADIUS</text>
  <text x="40" y="74" font-family="'DM Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">8-Microservice Hyperlocal Marketplace · Spring Cloud · Kafka Outbox</text>
</svg>
