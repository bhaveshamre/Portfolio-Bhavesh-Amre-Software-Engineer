<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFNO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="redCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgFNO)"/>

  <!-- Candlestick chart simulation -->
  <g opacity="0.85">
    <!-- Candle 1 (Green) -->
    <line x1="120" y1="210" x2="120" y2="350" stroke="#22c55e" stroke-width="2"/>
    <rect x="105" y="240" width="30" height="80" rx="3" fill="url(#greenCandle)"/>

    <!-- Candle 2 (Red) -->
    <line x1="200" y1="180" x2="200" y2="320" stroke="#ef4444" stroke-width="2"/>
    <rect x="185" y="210" width="30" height="60" rx="3" fill="url(#redCandle)"/>

    <!-- Candle 3 (Green) -->
    <line x1="280" y1="150" x2="280" y2="290" stroke="#22c55e" stroke-width="2"/>
    <rect x="265" y="170" width="30" height="90" rx="3" fill="url(#greenCandle)"/>

    <!-- Candle 4 (Green) -->
    <line x1="360" y1="120" x2="360" y2="270" stroke="#22c55e" stroke-width="2"/>
    <rect x="345" y="140" width="30" height="100" rx="3" fill="url(#greenCandle)"/>

    <!-- Candle 5 (Red) -->
    <line x1="440" y1="140" x2="440" y2="280" stroke="#ef4444" stroke-width="2"/>
    <rect x="425" y="160" width="30" height="50" rx="3" fill="url(#redCandle)"/>

    <!-- Candle 6 (Green) -->
    <line x1="520" y1="90" x2="520" y2="240" stroke="#22c55e" stroke-width="2"/>
    <rect x="505" y="110" width="30" height="110" rx="3" fill="url(#greenCandle)"/>

    <!-- Candle 7 (Green) -->
    <line x1="600" y1="70" x2="600" y2="210" stroke="#22c55e" stroke-width="2"/>
    <rect x="585" y="90" width="30" height="90" rx="3" fill="url(#greenCandle)"/>

    <!-- Candle 8 (Green Peak) -->
    <line x1="680" y1="50" x2="680" y2="190" stroke="#22c55e" stroke-width="2"/>
    <rect x="665" y="70" width="30" height="80" rx="3" fill="url(#greenCandle)"/>
  </g>

  <!-- Live WebSocket / STOMP Stream Wave -->
  <path d="M 60 380 Q 200 320, 360 350 T 660 310 T 750 330" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="750" cy="330" r="5" fill="#38bdf8"/>

  <!-- Overlay Indicators Badges -->
  <g transform="translate(180, 430)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#4ade80">● OI Analytics</text>
  </g>
  <g transform="translate(400, 430)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">⚡ WebSocket / STOMP</text>
  </g>
  <g transform="translate(620, 430)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" fill="#fbbf24">🔒 Auto Token Refresh</text>
  </g>

  <!-- Title Top -->
  <text x="40" y="50" font-family="'Syne', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="1">FNOPERCY</text>
  <text x="40" y="74" font-family="'DM Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">Real-Time Futures &amp; Options Analytics Platform · High-Frequency Stream</text>
</svg>
